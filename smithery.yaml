# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - slackToken
    properties:
      slackToken:
        type: string
        description: A Slack OAuth token. Store it in Smithery's secret configuration, not in source control.
      slackTeamId:
        type: string
        description: Optional Slack workspace ID. Required only for organization-level tokens.
  commandFunction:
    # A function that produces the CLI command to start the MCP on stdio.
    |-
    (config) => ({ command: 'node', args: ['dist/index.js'], env: { SLACK_TOKEN: config.slackToken, ...(config.slackTeamId && { SLACK_TEAM_ID: config.slackTeamId }) } })
